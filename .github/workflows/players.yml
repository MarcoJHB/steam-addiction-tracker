name: Player count samples

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:

concurrency:
  group: players
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Sample current player counts
        run: python scripts/players.py

      - name: Commit sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/players
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Player sample $(date -u +%Y-%m-%dT%H:%M)"
          # Other workflows push to main too; retry if one got there first.
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q && exit 0
            sleep $((i * 10))
          done
          exit 1
