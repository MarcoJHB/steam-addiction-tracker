name: Raw review export

on:
  workflow_dispatch:
    inputs:
      appids:
        description: "Steam app IDs, comma-separated"
        required: true
      label:
        description: "Name for the output file"
        default: "raw"
      reviews:
        description: "Recent reviews per game"
        default: "500"

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/raw_reviews.py --appids "${{ inputs.appids }}" --label "${{ inputs.label }}" --reviews "${{ inputs.reviews }}"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/raw
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Raw reviews: ${{ inputs.label }} $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
